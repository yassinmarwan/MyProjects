apiVersion: apps/v1
kind: Deployment
metadata:
  name: booking-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: booking-service
  template:
    metadata:
      labels:
        app: booking-service
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/actuator/prometheus"
    spec:
      containers:
        - name: booking-service
          image: eventticketing/booking-service:latest
          imagePullPolicy: Never # Uses your local Docker build
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: booking-service-config