spring:
  web:
    error:
      include-message: always
  datasource:
    ##jdbc:postgresql://postgres:5432/eventticketingdb
    url: jdbc:postgresql://booking-postgres:5432/etdb-bookings
    username: postgres
    password: postgres
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
  data:
    rest:
      base-path: /data
    redis:
      host: redis
      port: 6379
      password: redispass
  mongodb:
    uri: mongodb://root:rootpass@mongo:27017/eventticketingmongo?authSource=admin
  neo4j:
    uri: bolt://neo4j:7687
    authentication:
      username: neo4j
      password: neo4jpass
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: 5672
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASS:guest}
## exposing the endpoints of the actuator and the prometheus
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    prometheus:
      enabled: true
  metrics:
    tags:
      application: booking-service
feign:
  event-service:
    url: http://event-service:8080
  user-service:
    url: http://user-service:8080
  ticket-service:
    url: http://ticket-service:8080
  booking-service:
    url: http://booking-service:8080
  sales-service:
    url: http://sales-service:8080

jwt:
  secret: ${JWT_SECRET:24966c8a763b3a3f7f264cefb93d95159184e8c5e2af5c94e05387371d47a3fd=}
  expiration: ${JWT_EXPIRATION_MS:86400000}
