spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: user-service
              uri: http://user-service:8080
              predicates:
                - Path=/api/users/**, /api/auth/**
            - id: event-service
              uri: http://event-service:8080
              predicates:
                - Path=/api/events/**
            - id: booking-service
              uri: http://booking-service:8080
              predicates:
                - Path=/api/bookings/**
            - id: ticket-service
              uri: http://ticket-service:8080
              predicates:
                - Path=/api/tickets/**
            - id: sales-service
              uri: http://sales-service:8080
              predicates:
                - Path=/api/sales/**

management:
  endpoint:
    health:
      probes:
        enabled: true
  endpoints:
    web:
      exposure:
        include: "prometheus,health,info"
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true