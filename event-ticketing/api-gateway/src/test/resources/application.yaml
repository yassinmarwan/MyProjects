spring:
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: user-service
              uri: http://localhost:9999
              predicates:
                - Path=/api/users/**, /api/auth/**
            - id: event-service
              uri: http://localhost:9999
              predicates:
                - Path=/api/events/**
            - id: booking-service
              uri: http://localhost:9999
              predicates:
                - Path=/api/bookings/**
            - id: ticket-service
              uri: http://localhost:9999
              predicates:
                - Path=/api/tickets/**
            - id: sales-service
              uri: http://localhost:9999
              predicates:
                - Path=/api/sales/**
