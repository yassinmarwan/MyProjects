name: CI

on:
  push:
    branches:
      - "main"
      - "feat/**"
  pull_request:
    branches:
      - "main"

jobs:
  build:
    name: Maven build + JUnit
    runs-on: ubuntu-latest

    services:
      postgres-user:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: etdb-users
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      postgres-shared:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: eventticketingdb
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      postgres-booking:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: etdb-bookings
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ["5435:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      postgres-event:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: etdb-events
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ["5434:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      postgres-sales:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: etdb-sales
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ["5436:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      mongo:
        image: mongo:8
        env:
          MONGO_INITDB_ROOT_USERNAME: root
          MONGO_INITDB_ROOT_PASSWORD: rootpass
        ports: ["27017:27017"]
        options: >-
          --health-cmd "mongosh --username root --password rootpass --eval 'db.runCommand({ping:1})' --quiet"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:latest
        command: redis-server --requirepass redispass
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli -a redispass ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      rabbitmq:
        image: rabbitmq:3.13-management
        ports: ["5672:5672"]
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Install contracts
        run: mvn -B -pl contracts -am install -DskipTests

      - name: Build & test
        run: mvn -B verify -pl '!contracts'

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: "**/target/surefire-reports/"
          retention-days: 7

  docker:
    name: Docker build & push
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        service:
          - user-service
          - event-service
          - booking-service
          - ticket-service
          - sales-service
          - api-gateway

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Package ${{ matrix.service }}
        run: mvn -B -pl contracts,${{ matrix.service }} -am package -DskipTests

      - name: Log in to GitHub Container Registry
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set lowercase repo owner
        run: echo "OWNER_LC=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Build & push ${{ matrix.service }}
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.service }}
          push: ${{ github.ref == 'refs/heads/main' && github.event_name == 'push' }}
          tags: |
            ghcr.io/${{ env.OWNER_LC }}/${{ matrix.service }}:latest
            ghcr.io/${{ env.OWNER_LC }}/${{ matrix.service }}:${{ github.sha }}
